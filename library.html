<head>

    <link rel="apple-touch-icon" href="favicon.png">

        window.addEventListener('beforeunload', function (event) {

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G@me Hub</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #000000;
            --bg-panel: #111111;
            --bg-hover: #1a1a1a;
            --border-color: #222222;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #ffffff;
            --favorite: #eab308;
            --font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            overflow-x: hidden;
        }

        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            display: block;
        }

        .anko-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px 20px;
            position: relative;
            z-index: 100;
            gap: 16px;
        }

        .settings-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            z-index: 101;
        }
        .settings-btn:hover {
            color: var(--text-main);
            background: var(--bg-hover);
            transform: rotate(45deg) scale(1.05);
        }

        .source-tabs {
            display: flex;
            gap: 8px;
            background: rgba(20, 20, 20, 0.8);
            padding: 6px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            justify-content: center;
        }

        .source-tabs button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-family);
        }

        .source-tabs button:hover {
            color: var(--text-main);
        }

        .source-tabs button.active {
            background: var(--accent);
            color: #000000;
        }

        .loaded-count {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 5px;
            letter-spacing: -0.5px;
        }

        .search-container {
            width: 100%;
            max-width: 420px;
            margin-top: 5px;
        }

        .search-container input {
            width: 100%;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 20px;
            border-radius: 30px;
            font-size: 14px;
            text-align: center;
            outline: none;
            box-sizing: border-box;
            transition: 0.2s;
            font-family: var(--font-family);
        }

        .search-container input:focus {
            border-color: #444;
            background: #1a1a1a;
        }

        main { position: relative; z-index: 10; padding-bottom: 40px; }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            padding: 20px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .game-card {
            background-color: var(--bg-panel);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            opacity: 0;
            animation: fadeUp 0.4s ease forwards;
        }

        .game-card:hover {
            border: 1px solid #333;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        .card-image {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-color: #0a0a0a;
            transition: opacity 0.3s ease;
        }

        .star-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-muted);
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            z-index: 2;
        }

        .star-icon:hover { background-color: rgba(0, 0, 0, 0.9); transform: scale(1.1); color: var(--text-main); }
        .star-icon.active { color: var(--favorite); background-color: rgba(234, 179, 8, 0.15); border-color: var(--favorite); }

        .game-title {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 10px 10px;
            box-sizing: border-box;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%);
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 1;
        }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 20px; padding-bottom: 20px; }
        .pagination button { background-color: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 20px; padding: 8px 16px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .pagination button:hover:not(:disabled) { background-color: var(--bg-hover); }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-info { font-size: 14px; color: var(--text-muted); font-weight: 600; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Overhauled G@me Player */
        #zoneViewer {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px);
            z-index: 1000; display: none; flex-direction: column; animation: fadeIn 0.3s ease forwards;
            padding: 20px; box-sizing: border-box;
        }
        .viewer-content {
            flex: 1; width: 100%; max-width: 1200px; margin: 0 auto;
            background: #000; border-radius: 12px; border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); overflow: hidden; position: relative;
        }
        #zoneFrame { width: 100%; height: 100%; border: none; background: #000; }
        
        .viewer-footer {
            display: none !important; /* Kept in DOM strictly for reference by functions, but hidden visually */
        }
        
        /* Floating Left Controls */
        .floating-controls { 
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            display: flex; 
            gap: 8px; 
            z-index: 1000; 
        }
        .floating-controls button {
            background: rgba(20,20,20,0.9); 
            border: 1px solid var(--border-color); 
            color: var(--text-muted);
            width: 44px; 
            height: 44px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            padding: 0;
        }
        .floating-controls button:hover { 
            background: #333; 
            color: var(--text-main); 
            transform: translateY(-2px);
        }
        .floating-controls button i { width: 20px; height: 20px; }
        .floating-controls button svg { width: 20px; height: 20px; }
        .discord-icon { fill: currentColor; stroke: none; }
        .floating-controls button.close-btn:hover { color: #ff5555; border-color: rgba(255, 50, 50, 0.4); background: rgba(255, 50, 50, 0.1); }

        .zone-loader {
            position: absolute; inset: 0; background: #000; display: flex;
            align-items: center; justify-content: center; color: var(--accent);
            font-weight: 600; font-size: 18px; z-index: 10; pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #popupOverlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 2000; animation: fadeIn 0.3s;
        }
        .popup { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 16px; width: 90%; max-width: 400px; overflow: hidden; }
        .popup-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: rgba(20,20,20,0.9); }
        .popup-header h3 { font-size: 16px; margin: 0; }
        .popup-header button { background: transparent; border: none; color: var(--text-muted); cursor: pointer; transition: 0.2s;}
        .popup-header button:hover { color: var(--text-main); transform: rotate(90deg); }
        .popup-body { padding: 20px; color: var(--text-muted); font-size: 14px; line-height: 1.6; }
        .popup-body b { color: #fff; }
        .popup-body a { color: var(--accent); text-decoration: none; }
        .popup-body input[type="text"] { width: 100%; padding: 12px; margin: 8px 0 16px; background: #000; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; outline: none; font-family: var(--font-family); box-sizing: border-box; }
        
        .settings-menu { display: flex; flex-direction: column; gap: 8px; }
        .settings-menu button.action-btn, .popup-body button.action-btn { 
            width: 100%; padding: 12px; background: var(--bg-panel); border: 1px solid var(--border-color); 
            color: #fff; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; font-family: var(--font-family); text-align: center;
        }
        .settings-menu button.action-btn:hover, .popup-body button.action-btn:hover { background: var(--bg-hover); border-color: #444; }

        #loading-text { text-align: center; font-size: 16px; font-weight: 600; color: var(--text-muted); padding: 50px; grid-column: 1 / -1;}

        @media (max-width: 600px) {
            .game-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); padding: 20px; gap: 12px; }
            .settings-btn { top: 15px; right: 15px; width: 38px; height: 38px; }
            #zoneViewer { padding: 0px; }
            .viewer-content { border-radius: 0; border: none; }
            .floating-controls { bottom: 10px; left: 10px; gap: 6px; }
            .floating-controls button { width: 38px; height: 38px; }
        }
    </style>
</head>

<script type="module">
    import { Renderer, Program, Mesh, Triangle } from 'https://esm.sh/ogl@1.0.11';

    const CONFIG = {
        spinRotation:    -2.0,
        spinSpeed:        7.0,
        offset:          [0.0, 0.0],
        color1:          '#838282',
        color2:          '#000000',
        color3:          '#000000',
        contrast:         3.5,
        lighting:         0.4,
        spinAmount:       0.25,
        pixelFilter:    745.0,
        spinEase:         1.0,
        isRotate:         false,
        mouseInteraction: false,
    };

    function hexToVec4(hex) {
        const h = hex.replace('#', '');
        let r = 0, g = 0, b = 0, a = 1;
        if (h.length === 6) { r = parseInt(h.slice(0, 2), 16) / 255; g = parseInt(h.slice(2, 4), 16) / 255; b = parseInt(h.slice(4, 6), 16) / 255; } 
        else if (h.length === 8) { r = parseInt(h.slice(0, 2), 16) / 255; g = parseInt(h.slice(2, 4), 16) / 255; b = parseInt(h.slice(4, 6), 16) / 255; a = parseInt(h.slice(6, 8), 16) / 255; }
        return [r, g, b, a];
    }

    const vertexShader = `
        attribute vec2 uv;
        attribute vec2 position;
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = vec4(position, 0, 1); }`;

    const fragmentShader = `
        precision highp float;
        uniform float iTime; uniform vec3 iResolution; uniform float uSpinRotation; uniform float uSpinSpeed;
        uniform vec2 uOffset; uniform vec4 uColor1; uniform vec4 uColor2; uniform vec4 uColor3;
        uniform float uContrast; uniform float uLighting; uniform float uSpinAmount; uniform float uPixelFilter;
        uniform float uSpinEase; uniform bool uIsRotate; uniform vec2 uMouse;
        varying vec2 vUv;
        vec4 effect(vec2 screenSize, vec2 screen_coords) {
            float pixel_size = length(screenSize.xy) / uPixelFilter;
            vec2 uv = (floor(screen_coords.xy * (1.0 / pixel_size)) * pixel_size - 0.5 * screenSize.xy) / length(screenSize.xy) - uOffset;
            float uv_len = length(uv);
            float speed = (uSpinRotation * uSpinEase * 0.2);
            if (uIsRotate) { speed = iTime * speed; }
            speed += 302.2;
            float mouseInfluence = (uMouse.x * 2.0 - 1.0); speed += mouseInfluence * 0.1;
            float new_pixel_angle = atan(uv.y, uv.x) + speed - uSpinEase * 20.0 * (uSpinAmount * uv_len + (1.0 - uSpinAmount));
            vec2 mid = (screenSize.xy / length(screenSize.xy)) / 2.0;
            uv = (vec2(uv_len * cos(new_pixel_angle) + mid.x, uv_len * sin(new_pixel_angle) + mid.y) - mid);
            uv *= 30.0;
            float baseSpeed = iTime * uSpinSpeed; speed = baseSpeed + mouseInfluence * 2.0;
            vec2 uv2 = vec2(uv.x + uv.y);
            for (int i = 0; i < 5; i++) {
                uv2 += sin(max(uv.x, uv.y)) + uv;
                uv += 0.5 * vec2( cos(5.1123314 + 0.353 * uv2.y + speed * 0.131121), sin(uv2.x - 0.113 * speed) );
                uv -= cos(uv.x + uv.y) - sin(uv.x * 0.711 - uv.y);
            }
            float contrast_mod = (0.25 * uContrast + 0.5 * uSpinAmount + 1.2);
            float paint_res = min(2.0, max(0.0, length(uv) * 0.035 * contrast_mod));
            float c1p = max(0.0, 1.0 - contrast_mod * abs(1.0 - paint_res));
            float c2p = max(0.0, 1.0 - contrast_mod * abs(paint_res));
            float c3p = 1.0 - min(1.0, c1p + c2p);
            float light = (uLighting - 0.2) * max(c1p * 5.0 - 4.0, 0.0) + uLighting * max(c2p * 5.0 - 4.0, 0.0);
            return (0.3 / uContrast) * uColor1 + (1.0 - 0.3 / uContrast) * (uColor1 * c1p + uColor2 * c2p + vec4(c3p * uColor3.rgb, c3p * uColor1.a)) + light;
        }
        void main() { vec2 uv = vUv * iResolution.xy; gl_FragColor = effect(iResolution.xy, uv); }`;

    const canvas = document.getElementById('starfield');
    const renderer = new Renderer({ canvas, alpha: true });
    const gl = renderer.gl; gl.clearColor(0, 0, 0, 1);
    let program;

    function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (program) program.uniforms.iResolution.value = [gl.canvas.width, gl.canvas.height, gl.canvas.width / gl.canvas.height];
    }
    window.addEventListener('resize', resize); resize();

    const geometry = new Triangle(gl);
    program = new Program(gl, {
        vertex: vertexShader, fragment: fragmentShader,
        uniforms: {
            iTime: { value: 0 }, iResolution: { value: [gl.canvas.width, gl.canvas.height, gl.canvas.width / gl.canvas.height] },
            uSpinRotation: { value: CONFIG.spinRotation }, uSpinSpeed: { value: CONFIG.spinSpeed }, uOffset: { value: CONFIG.offset },
            uColor1: { value: hexToVec4(CONFIG.color1) }, uColor2: { value: hexToVec4(CONFIG.color2) }, uColor3: { value: hexToVec4(CONFIG.color3) },
            uContrast: { value: CONFIG.contrast }, uLighting: { value: CONFIG.lighting }, uSpinAmount: { value: CONFIG.spinAmount },
            uPixelFilter: { value: CONFIG.pixelFilter }, uSpinEase: { value: CONFIG.spinEase }, uIsRotate: { value: CONFIG.isRotate }, uMouse: { value: [0.5, 0.5] },
        },
    });

    const mesh = new Mesh(gl, { geometry, program });
    window.addEventListener('mousemove', (e) => {
        if (!CONFIG.mouseInteraction) return;
        program.uniforms.uMouse.value = [ e.clientX / window.innerWidth, 1.0 - (e.clientY / window.innerHeight) ];
    });

    function update(time) { requestAnimationFrame(update); program.uniforms.iTime.value = time * 0.001; renderer.render({ scene: mesh }); }
    requestAnimationFrame(update);
</script>

<script>

    /* --- Settings & Popup Handlers --- */
    function openSettings() {
        document.getElementById('popupTitle').textContent = "Settings & Menu";
        document.getElementById('popupBody').innerHTML = `
            <div class="settings-menu">
                <button class="action-btn" onclick="toggleFavoritesView(); closePopup();">${showOnlyFavorites ? "Show All G@mes" : "Show Favorites"}</button>

    function toggleFavorite(event, id) {
        event.stopPropagation(); 
        if (favorites.includes(id)) favorites = favorites.filter(f => f !== id);
        else favorites.push(id);
        localStorage.setItem('gameFavorites', JSON.stringify(favorites));
        event.currentTarget.classList.toggle('active');
        event.currentTarget.textContent = event.currentTarget.classList.contains('active') ? "★" : "☆";
        if (showOnlyFavorites) renderCurrentView();
    }

    function toggleFavoritesView() {
        showOnlyFavorites = !showOnlyFavorites;
        currentPage = 1;
        renderCurrentView();

    function setSort(type) { currentSort = type; currentPage = 1; renderCurrentView(); }

    function cloakIcon(url) {
        let link = document.querySelector("link[rel~='icon']");
        if(!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
        link.href = (url+"").trim().length === 0 ? "favicon.png" : url;

    function closePopup() {

    /* --- Data Handlers --- */
    async function saveData() {
        let data = {};
        for (let i = 0; i < localStorage.length; i++) { let key = localStorage.key(i); data[key] = localStorage.getItem(key); }
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = "GameHub_SaveData.json";
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        
        document.getElementById('popupTitle').textContent = "Export Successful";
        document.getElementById('popupBody').innerHTML = `<p style="text-align:center;"><b>Success!</b> Your local g@me saves have been downloaded.</p>`;
    }

    async function loadData(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                for (let key in data) localStorage.setItem(key, data[key]);
                favorites = JSON.parse(localStorage.getItem('gameFavorites')) || [];
                document.getElementById('popupTitle').textContent = "Import Successful";
                document.getElementById('popupBody').innerHTML = `<p style="text-align:center;"><b>Success!</b> Your g@me saves have been restored.</p>`;
                document.getElementById('popupOverlay').style.display = "flex";
                renderCurrentView();
            } catch (err) {
                document.getElementById('popupTitle').textContent = "Import Failed";
                document.getElementById('popupBody').innerHTML = `<p style="text-align:center; color:red;">Invalid save data file. Ensure it is a valid JSON.</p>`;
                document.getElementById('popupOverlay').style.display = "flex";
            }
            event.target.value = ''; 
        };
        reader.readAsText(file);
    }

    /* --- Grid Loading --- */
    const container = document.getElementById('container');
    const zoneViewer = document.getElementById('zoneViewer');
    let zoneFrame = document.getElementById('zoneFrame');

    async function listZones() {
        container.innerHTML = '<div id="loading-text">LOADING G@MES...</div>';
        document.getElementById('pagination-controls').style.display = 'none';
        zones = [];
        try {
            if (currentSource === 'gn-math') {
                const response = await fetch(GNMATH_API + "?t=" + Date.now());
                const rawZones = await response.json();
                zones = rawZones.map(z => ({
                    ...z,
                    computedUrl: z.url ? z.url.replace("{COVER_URL}", GNMATH_COVER).replace("{HTML_URL}", GNMATH_HTML) : "",
                    computedCover: z.cover ? z.cover.replace("{COVER_URL}", GNMATH_COVER).replace("{HTML_URL}", GNMATH_HTML) : ""
                }));
                fetchPopularity("year");

            } else if (currentSource === 'ugs') {
                const response = await fetch(UGS_API + "?t=" + Date.now());
                const rawZones = await response.json();
                zones = rawZones.map(z => {
                    let finalUrl = z.url || z.link || "";
                    let finalCover = z.cover || z.image || "";
                    if(finalUrl) finalUrl = finalUrl.replace("{HTML_URL1}", UGS_HTML_URL1).replace("{HTML_URL2}", UGS_HTML_URL2).replace("{HTML_URL3}", UGS_HTML_URL3);
                    if(finalCover) finalCover = finalCover.replace("{HTML_URL1}", UGS_HTML_URL1).replace("{HTML_URL2}", UGS_HTML_URL2).replace("{HTML_URL3}", UGS_HTML_URL3);
                    return { ...z, computedUrl: finalUrl, computedCover: finalCover };
                });
            } else if (currentSource === 'daknux') {
                const response = await fetch(DAKNUX_API + "?t=" + Date.now());
                const rawZones = await response.json();
                zones = rawZones.map((z, index) => {
                    return {
                        ...z, id: z.id || z.name || index, title: z.name,
                        computedUrl: z.url ? z.url.replace("{COVER_URL}", DAKNUX_COVER).replace("{HTML_URL}", DAKNUX_HTML) : "",
                        computedCover: z.cover ? z.cover.replace("{COVER_URL}", DAKNUX_COVER).replace("{HTML_URL}", DAKNUX_HTML) : ""
                    };
                });
            } else if (currentSource === 'ports') {
                zones = PORTS_GAMES.map(z => ({
                    ...z,
                    computedUrl: z.url,
                    computedCover: z.cover
                }));
            } else if (currentSource === 'cloud') {
                zones = [...CLOUD_GAMES];
            }
            
            document.getElementById('loadedCount').textContent = `loaded ${zones.length} g@mes`;
            document.getElementById('gameSearch').value = "";
            renderCurrentView();

            const search = new URLSearchParams(window.location.search);
            const id = search.get('id');
            if (id) {
                const zone = zones.find(z => z.id + '' == id + '');
                if (zone) openZone(zone);
            }
        } catch (error) {
            container.innerHTML = `<div id="loading-text" style="color:red;">Error loading zones. Please check your connection.</div>`;
        }
    }

    async function fetchPopularity(duration) {
        try {
            if (!popularityData[duration]) popularityData[duration] = {};
            const response = await fetch("https://data.jsdelivr.com/v1/stats/packages/gh/freebuisness/html@main/files?period=" + duration);
            const data = await response.json();
            data.forEach(file => {
                const idMatch = file.name.match(/\/(\d+)\.html$/);
                if (idMatch) popularityData[duration][parseInt(idMatch[1])] = file.hits?.total ?? 0;
            });
        } catch (error) {
            if (!popularityData[duration]) popularityData[duration] = {};
            popularityData[duration][0] = 0;
        }
    }

    function renderCurrentView() {
        let filtered = [...zones];
        if (showOnlyFavorites) filtered = filtered.filter(z => favorites.includes(z.id));
        const query = document.getElementById('gameSearch').value.toLowerCase().trim();
        if (query) filtered = filtered.filter(z => (z.name || z.title || "").toLowerCase().includes(query));

        if (currentSort === 'A-Z') filtered.sort((a, b) => (a.name || a.title || "").localeCompare(b.name || b.title || ""));
        else if (currentSort === 'Z-A') filtered.sort((a, b) => (b.name || b.title || "").localeCompare(a.name || a.title || ""));

        const totalPages = Math.max(1, Math.ceil(filtered.length / gamesPerPage));
        if (currentPage > totalPages) currentPage = 1;
        
        displayGrid(filtered.slice((currentPage - 1) * gamesPerPage, ((currentPage - 1) * gamesPerPage) + gamesPerPage));
        renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
        const pagContainer = document.getElementById('pagination-controls');
        if (totalPages <= 1) { pagContainer.style.display = 'none'; return; }
        pagContainer.style.display = 'flex';
        pagContainer.innerHTML = `
            <button onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''} aria-label="Previous Page"><i data-lucide="arrow-left" style="width:20px;height:20px;"></i></button>
            <span class="page-info">Page ${currentPage} of ${totalPages}</span>
            <button onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''} aria-label="Next Page"><i data-lucide="arrow-right" style="width:20px;height:20px;"></i></button>
        `;
        lucide.createIcons();
    }

    function changePage(delta) { currentPage += delta; renderCurrentView(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

    function displayGrid(zoneList) {
        container.innerHTML = "";
        if (!zoneList || zoneList.length === 0) { container.innerHTML = `<div id="loading-text">No g@mes found.</div>`; return; }

        zoneList.forEach((file, index) => {
            const card = document.createElement("div"); card.className = "game-card"; card.style.animationDelay = `${(index % gamesPerPage) * 0.02}s`;
            card.onclick = () => openZone(file);
            
            const isFav = favorites.includes(file.id);
            const starBtn = document.createElement("div"); starBtn.className = `star-icon ${isFav ? 'active' : ''}`;
            starBtn.onclick = (e) => toggleFavorite(e, file.id); starBtn.textContent = isFav ? "★" : "☆";

            const img = document.createElement("div"); img.className = "card-image lazy-bg"; img.dataset.bg = file.computedCover || FALLBACK_IMAGE;
            const titleDiv = document.createElement("div"); titleDiv.className = "game-title"; titleDiv.textContent = file.name || file.title || "Unknown G@me";

            card.appendChild(img); card.appendChild(starBtn); card.appendChild(titleDiv); container.appendChild(card);
        });
        setupLazyLoading();
    }

    function setupLazyLoading() {
        const observer = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && zoneViewer.style.display !== "flex") {
                    const el = entry.target; const bgUrl = el.dataset.bg;
                    if(bgUrl) {
                        const tempImg = new Image();
                        tempImg.onload = () => { el.style.backgroundImage = `url('${bgUrl}')`; };
                        tempImg.onerror = () => { el.style.backgroundImage = `url('${FALLBACK_IMAGE}')`; };
                        tempImg.src = bgUrl;
                    }
                    el.classList.remove("lazy-bg"); obs.unobserve(el);
                }
            });
        }, { rootMargin: "100px", threshold: 0.1 });
        document.querySelectorAll('.lazy-bg').forEach(bg => observer.observe(bg));
    }

    /* --- G@me Viewer Handlers --- */
    function openZone(file) {
        const url = file.computedUrl || file.url;
        
        // Setup Simulated Asset Loader (76/76)
        const loader = document.getElementById('zoneLoader');
        const progEl = document.getElementById('loadProgress');
        if(loader && progEl) {
            loader.style.opacity = '1';
            let progress = 0; const maxAssets = 76; 
            progEl.textContent = `0/${maxAssets}`;
            if(window.loaderInterval) clearInterval(window.loaderInterval);
            
            window.loaderInterval = setInterval(() => {
                progress += Math.floor(Math.random() * 6) + 1;
                if(progress >= maxAssets) {
                    progress = maxAssets;
                    clearInterval(window.loaderInterval);
                    setTimeout(() => { loader.style.opacity = '0'; }, 300);
                }
                progEl.textContent = `${progress}/${maxAssets}`;
            }, 30);
        }

        fetch(url+"?t="+Date.now()).then(response => response.text()).then(html => {
            injectHtmlIntoFrame(html, file);
        }).catch(error => {
            loadUrlIntoFrame(url, file);
        });
    }

    function loadUrlIntoFrame(url, file) {
        if (zoneFrame && zoneFrame.parentNode) zoneFrame.parentNode.removeChild(zoneFrame);
        zoneFrame = document.createElement("iframe"); zoneFrame.id = "zoneFrame";
        
        // Insert iframe right before the floating controls
        const controls = document.querySelector('.floating-controls');
        document.querySelector('.viewer-content').insertBefore(zoneFrame, controls);
        
        zoneFrame.src = url; updateZoneInfo(file);
    }

    function injectHtmlIntoFrame(html, file) {
        if (zoneFrame && zoneFrame.parentNode) zoneFrame.parentNode.removeChild(zoneFrame);
        zoneFrame = document.createElement("iframe"); zoneFrame.id = "zoneFrame";
        
        // Insert iframe right before the floating controls
        const controls = document.querySelector('.floating-controls');
        document.querySelector('.viewer-content').insertBefore(zoneFrame, controls);
        
        zoneFrame.contentDocument.open(); zoneFrame.contentDocument.write(html); zoneFrame.contentDocument.close();
        updateZoneInfo(file);
    }

    function updateZoneInfo(file) {
        document.getElementById('zoneName').textContent = file.name || file.title || "Unknown G@me";
        document.getElementById('zoneId').textContent = file.id;
        document.getElementById('zoneAuthor').textContent = "by " + (file.author || "Unknown");
        if (file.authorLink) document.getElementById('zoneAuthor').href = file.authorLink;
        
        zoneViewer.style.display = "flex";
        try {
            const navUrl = new URL(window.location); navUrl.searchParams.set('id', file.id);
            history.pushState(null, '', navUrl.toString());
        } catch(e){}
    }

    function closeZone() {
        zoneViewer.style.animation = "fadeIn 0.3s ease reverse forwards";
        setTimeout(() => {
            zoneViewer.style.display = "none";
            zoneViewer.style.animation = "fadeIn 0.3s ease forwards"; 
            if (zoneFrame && zoneFrame.parentNode) zoneFrame.parentNode.removeChild(zoneFrame);
            zoneFrame = document.createElement("iframe"); zoneFrame.id = "zoneFrame";
            const controls = document.querySelector('.floating-controls');
            document.querySelector('.viewer-content').insertBefore(zoneFrame, controls);
        }, 300);
        try {
            const navUrl = new URL(window.location); navUrl.searchParams.delete('id');
            history.pushState(null, '', navUrl.toString());
        } catch(e){}
    }

    function fullscreenZone() {
        if (zoneFrame.requestFullscreen) zoneFrame.requestFullscreen();
        else if (zoneFrame.mozRequestFullScreen) zoneFrame.mozRequestFullScreen();
        else if (zoneFrame.webkitRequestFullscreen) zoneFrame.webkitRequestFullscreen();
        else if (zoneFrame.msRequestFullscreen) zoneFrame.msRequestFullscreen();
    }
    
    function refreshZone() {
        let id = document.getElementById('zoneId').textContent;
        let zone = zones.find(a => a.id + '' === id);
        if (zone) {
            openZone(zone);
        }
    }
    
    function aboutBlank() {
        const newWindow = window.open("about:blank", "_blank");
        const currentId = document.getElementById('zoneId').textContent;
        let zone = zones.find(z => z.id + '' === currentId);
        if (!zone) return;
        const url = zone.computedUrl || zone.url;
        const iframeInjection = `<iframe src="${url}" style="position:fixed; top:0; left:0; bottom:0; right:0; width:100%; height:100%; border:none; margin:0; padding:0; overflow:hidden; z-index:999999;"></iframe>`;
        fetch(url+"?t="+Date.now()).then(response => response.text()).then(html => {
            if (newWindow) { newWindow.document.open(); newWindow.document.write(html); newWindow.document.close(); }
        }).catch(e => {
            if (newWindow) { newWindow.document.open(); newWindow.document.write(iframeInjection); newWindow.document.close(); }
        });
    }

    async function downloadZone() {
        const id = document.getElementById('zoneId').textContent;
        const zone = zones.find(z => z.id + '' === id + '');
        if(!zone) return;
        try {
            const url = zone.computedUrl || zone.url;
            const response = await fetch(url);
            const text = await response.text();
            const blob = new Blob([text], { type: "text/html" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = (zone.name || zone.title || "g@me") + ".html";
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        } catch(e) { alert("Failed to download g@me source."); }
    }

    function showZoneInfo() {
        let id = document.getElementById('zoneId').textContent;
        let idjson = zones.find(a => a.id + '' === id);
        
        document.getElementById('popupTitle').textContent = `${idjson.name || idjson.title} Info`;
        const popupBody = document.getElementById('popupBody');
        
        if(currentSource !== 'gn-math') {
            popupBody.innerHTML = `<p><b>Name:</b> ${idjson.name || idjson.title}</p><p><b>Source:</b> ${idjson.author || 'Unknown'}</p><p><b>ID:</b> ${id}</p>`;
            document.getElementById('popupOverlay').style.display = "flex"; return;
        }

        popupBody.innerHTML = `<p style="text-align:center;">Loading data...</p>`;
        document.getElementById('popupOverlay').style.display = "flex";
        
        fetch(`https://api.github.com/repos/freebuisness/html/commits?path=${id}.html`).then(res => res.json()).then(async json => {
            let stats = popularityData['year']?.[id] || 0;
            const date = new Date(json.at(-1).commit.author.date);
            let formatteddate = new Intl.DateTimeFormat("en-US", { month: "long", day: "numeric", year: "numeric" }).format(date);
            
            popupBody.innerHTML = `
                <p><b>ID:</b> ${id}</p><p><b>Name:</b> ${idjson.name || idjson.title}</p>
                ${idjson.author ? `<p><b>Author:</b> ${idjson.author}</p>` : ""}
                ${idjson.authorLink ? `<p><b>Link:</b> <a href="${idjson.authorLink}" target="_blank">Visit Author</a></p>` : ""}
                <br><p><b>Added By:</b> ${json.at(-1).commit.author.name}</p>
                <p><b>Date Added:</b> ${formatteddate}</p>
                <p><b>Times Played:</b> ${Number(stats).toLocaleString("en-US")}</p>
            `;
        }).catch(err => { popupBody.innerHTML = `<p style="color:red;">Failed to load additional info.</p>`; });
    }

    HTMLCanvasElement.prototype.toDataURL = function (...args) { return ""; };
    listZones();
    try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js'); } catch(e) {}
</script>
